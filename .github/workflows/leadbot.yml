name: Agente Diário de Extração de Leads

on:
  schedule:
    # Roda todos os dias às 08:00 UTC (05:00 no horário de Brasília)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite disparo manual pelo painel do GitHub Actions

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Executar Agente Scraper de Escolas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scripts/lead_scraper.py
