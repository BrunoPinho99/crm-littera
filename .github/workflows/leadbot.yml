name: Agente Diário de Extração de Leads

on:
  workflow_dispatch: # Permite disparo manual pelo painel do GitHub Actions (será refeito na Etapa 8)

jobs:
  importar-censo-diario:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Executar Importador do Censo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_MATRICULAS_EM: '40'
        run: |
          python scripts/importar_censo.py
