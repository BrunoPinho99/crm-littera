name: Descoberta de Decisores no Site Oficial

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Limite de escolas a processar'
        required: false
        type: string
        default: '40'

jobs:
  descobrir-decisores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Executar Descoberta de Decisores via Google Places, Crawler e Claude
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-3-5-haiku-latest' }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          LITTERA_CONTATO: ${{ secrets.LITTERA_CONTATO || 'contato@littera.com.br' }}
        run: |
          python scripts/descobrir_decisores.py --limite "${{ inputs.limite }}"
