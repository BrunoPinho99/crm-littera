name: Enriquecer Escolas por CNPJ

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Limite de escolas a enriquecer'
        required: false
        type: string
        default: '100'
      usar_apify:
        description: 'Buscar previamente CNPJs faltantes via Apify'
        required: false
        type: boolean
        default: false

jobs:
  enriquecer-cnpj:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Localizar CNPJs Faltantes via Apify (Opcional)
        if: ${{ inputs.usar_apify }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python scripts/achar_cnpj_apify.py

      - name: Executar Enriquecimento por CNPJ e QSA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/enriquecer_cnpj.py --limite "${{ inputs.limite }}"
