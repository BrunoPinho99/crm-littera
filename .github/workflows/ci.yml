name: CI (Integração Contínua)

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências Node
        run: npm ci

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pytest

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificação de Tipos TypeScript
        run: npx tsc --noEmit

      - name: Build do Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          BREVO_API_KEY: xkeysib-dummy-brevo-key
          UNSUBSCRIBE_SECRET: dummy-secret-32-bytes-minimum-length
          CRON_SECRET: dummy-cron-secret
          CALCOM_WEBHOOK_SECRET: dummy-calcom-secret
          APP_URL: http://localhost:3000
          NOTIFICAR_EMAIL: teste@littera.com.br
        run: npm run build

      - name: Testes TypeScript (Vitest)
        env:
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          BREVO_API_KEY: xkeysib-dummy-brevo-key
          UNSUBSCRIBE_SECRET: dummy-secret-32-bytes-minimum-length
          CRON_SECRET: dummy-cron-secret
          CALCOM_WEBHOOK_SECRET: dummy-calcom-secret
          APP_URL: http://localhost:3000
          NOTIFICAR_EMAIL: teste@littera.com.br
        run: npm test

      - name: Testes Python (Pytest)
        run: python -m pytest scripts/tests
